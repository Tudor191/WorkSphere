name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://worksphere:worksphere@localhost:5432/worksphere_test?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: worksphere
          POSTGRES_PASSWORD: worksphere
          POSTGRES_DB: worksphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Generează Prisma Client + rulează migrațiile
        run: |
          pnpm --filter @worksphere/database run generate
          pnpm --filter @worksphere/database run migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Teste unitare
        run: pnpm --filter @worksphere/api run test

      - name: Teste e2e (API)
        run: pnpm --filter @worksphere/api run test:e2e

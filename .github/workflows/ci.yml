name: CI

on:
  push:
    branches: [claude/saas-firme-romania-cqqcmu]
  pull_request:
    branches: [claude/saas-firme-romania-cqqcmu]

env:
  DATABASE_URL: postgresql://worksphere:worksphere@localhost:5432/worksphere_test?schema=public

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: worksphere
          POSTGRES_PASSWORD: worksphere
          POSTGRES_DB: worksphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Generează Prisma Client + rulează migrațiile
        run: |
          pnpm --filter @worksphere/database run generate
          pnpm --filter @worksphere/database run migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Teste unitare
        run: pnpm --filter @worksphere/api run test

      # Rulat cu superuserul (`worksphere`) direct, testele e2e ar trece
      # oricum, indiferent dacă RLS chiar funcționează sau nu — superuserii
      # ocolesc RLS necondiționat în Postgres, indiferent de
      # FORCE ROW LEVEL SECURITY. Fără rolul dedicat aici, testele de
      # izolare multi-tenant ar verifica STRICT filtrarea explicită
      # `companyId` din cod, nu RLS-ul propriu-zis — exact bug-ul original
      # care a pornit acest proiect ar putea trece neobservat prin CI.
      - name: Creează rolul dedicat al aplicației (worksphere_app), la fel ca în docker-compose
        env:
          PGPASSWORD: worksphere
        run: |
          psql -h localhost -U worksphere -d worksphere_test -v ON_ERROR_STOP=1 <<-'EOSQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'worksphere_app') THEN
                CREATE ROLE worksphere_app LOGIN PASSWORD 'worksphere_app'
                  NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
              END IF;
            END
            $$;

            GRANT CONNECT ON DATABASE worksphere_test TO worksphere_app;
            GRANT USAGE ON SCHEMA public TO worksphere_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO worksphere_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO worksphere_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE worksphere IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO worksphere_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE worksphere IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO worksphere_app;
          EOSQL

      - name: Teste e2e (API)
        env:
          DATABASE_URL: postgresql://worksphere_app:worksphere_app@localhost:5432/worksphere_test?schema=public
        run: pnpm --filter @worksphere/api run test:e2e
